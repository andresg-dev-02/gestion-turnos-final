<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gestión de Turnos y Asistencia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Plataforma web progresiva (PWA) para la consulta de turnos, marcaje de asistencia, vacaciones y gestión de novedades laborales.">
  <meta name="theme-color" content="#1D768A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnos">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    // El navegador puede ofrecer la instalación antes de que Angular arranque: se guarda el evento
    // para que el aviso de instalación (PwaUpdateService) lo use cuando esté listo.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__eventoInstalacionPwa = e;
      window.dispatchEvent(new Event('pwa-instalable'));
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-[#1D768A] selection:text-white">
  <app-root></app-root>
  <noscript>
    <div role="alert" style="padding: 1.5rem; font-family: system-ui, sans-serif; background: #fee2e2; color: #991b1b; border: 2px solid #b91c1c; margin: 1rem; border-radius: 0.5rem;">
      <strong>JavaScript es requerido:</strong> Por favor habilita JavaScript en tu navegador para utilizar la aplicación de Gestión de Turnos y Asistencia.
    </div>
  </noscript>
</body>
</html>
